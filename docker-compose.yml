services:
  web:
    build:
      context: ./web
      dockerfile: ../deploy/Dockerfile.web
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 25s

  api:
    build:
      context: ./api
      dockerfile: ../deploy/Dockerfile.api
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/secureflow.db
    volumes:
      - ./data:/app/data
    command:
      - sh
      - -c
      - mkdir -p /app/data && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
