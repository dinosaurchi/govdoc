services:
  web:
    build:
      context: ./web
      dockerfile: ../deploy/Dockerfile.web
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - APP_ENV=development
      - APP_PORT=8000
      - WEB_PORT=3000
      - API_BASE_URL=http://api:8000
      - DATABASE_URL=sqlite:////app/data/secureflow.db
      - LOCAL_FILE_STORAGE_ROOT=data/uploads
      - MODELS_CONFIG_PATH=api/config/models.yaml
      - ROLES_CONFIG_PATH=api/config/roles.yaml
      - PROMPT_CONFIG_PATH=api/prompts
      - ENABLE_DEMO_MODE=true
      - ENABLE_CACHED_AI_RESULTS=false
      - MODELSTUDIO_API_KEY=${MODELSTUDIO_API_KEY:-}
      - MODELSTUDIO_BASE_URL=${MODELSTUDIO_BASE_URL:-}
      - MODELSTUDIO_DASHSCOPE_URL=${MODELSTUDIO_DASHSCOPE_URL:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
