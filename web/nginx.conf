server {
    listen 3000;
    server_name _;

    # Default is 1m — larger uploads were rejected with 413 and an HTML body,
    # which surfaced as the generic "API request failed" in the browser.
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    # Bundled demo PDFs live under /demo/ — must be real files in the image, never the SPA
    # fallback (otherwise try_files serves index.html and browsers report a failed download).
    location ^~ /demo/ {
        try_files $uri =404;
    }

    # Proxy API calls to the FastAPI backend
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }

    # SPA fallback — all unmatched paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
